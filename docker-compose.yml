services:
  postgres:
    image: postgres:16-alpine
    container_name: datascope-postgres
    restart: always
    environment:
      POSTGRES_USER: datascope
      POSTGRES_PASSWORD: datascope_secret_password
      POSTGRES_DB: datascope_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U datascope -d datascope_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
